[package]
name = "bench-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bench-core = { path = "../core" }
# NSH：实测版本 d3655d3 + PR #282 补丁，由 scripts/setup.sh 准备到 vendor/nsh
# 不要默认的 webview（经 webkit2gtk 链接 GTK 3，与原生后端的 GTK 4 冲突）
nsh-platform-gpui = { path = "../vendor/nsh/crates/gpui/nsh-platform-gpui", default-features = false, features = ["js", "runtime-shaders"] }
nsh-core = { path = "../vendor/nsh/crates/nsh-core" }
nsh-ui-mobile = { path = "../vendor/nsh/crates/nsh-ui-mobile" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.9", default-features = false, features = ["font-kit"] }
# 打开 GPUI profiler（与 Rust 版同一套帧指标）
gpui-fast = { version = "0.1.9", default-features = false, features = ["profiler"] }
futures = "0.3"
serde_json = "1"
env_logger = "0.11"
log = "0.4"

# NSH 原生后端（默认，Linux / macOS / Windows）；nsh-platform-gpui 用 BENCH_BACKEND=gpui 作对照
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { path = "../vendor/nsh/crates/nsh-platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { path = "../vendor/nsh/crates/nsh-platform-macos" }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { path = "../vendor/nsh/crates/nsh-platform-windows" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# 剖析用：与 release 相同的优化，保留符号与行号（samply / perf）
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
